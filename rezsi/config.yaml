# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Rezsi
version: "0.1.0"
slug: rezsi
description: Household utility tracker with reminders and git export
url: https://github.com/gulyasfeccferenc/home-assistant-rezsi-daemon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# The image runs node under Docker's init (the s6 entrypoint of the base image is not used).
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Rezsi
homeassistant_api: true
hassio_api: true
backup: hot
backup_exclude:
  - "*.tmp-*"
options:
  notify_service: mobile_app_ifecc
  reminder_time: "09:00"
  repeat_every_days: 2
  gas_window_start_day: 20
  gas_window_end_day: 28
  electricity_window_start_day: 8
  electricity_window_end_day: 11
  water_interval_days: 60
  water_window_days: 7
  yoy_warning_percent: 15
  publish_entities: true
  export_enabled: false
  export_day: 1
  export_time: "06:00"
  git_branch: main
  git_author_name: Rezsi add-on
  git_author_email: rezsi@localhost
schema:
  notify_service: str
  reminder_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  repeat_every_days: int(1,7)
  gas_window_start_day: int(1,28)
  gas_window_end_day: int(1,31)
  electricity_window_start_day: int(1,28)
  electricity_window_end_day: int(1,31)
  water_interval_days: int(7,365)
  water_window_days: int(1,31)
  yoy_warning_percent: int(1,100)
  publish_entities: bool
  export_enabled: bool
  export_day: int(1,28)
  export_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  git_repo_url: str?
  git_token: password?
  git_branch: str
  git_author_name: str
  git_author_email: email
